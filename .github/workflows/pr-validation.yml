name: PR Validation for DMZ Branch

on:
  pull_request:
    branches: [dmz]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.14.1"
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  pr-validation:
    # Keep this check name stable for existing branch-protection settings.
    name: Validate Pull Request
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: examples/basic-nextjs

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check PR branch is based on latest main
        working-directory: .
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin main
          # Compare the PR head, not GitHub's synthetic merge commit.
          MERGE_BASE=$(git merge-base "$PR_HEAD_SHA" origin/main)
          MAIN_HEAD=$(git rev-parse origin/main)
          if [ "$MERGE_BASE" != "$MAIN_HEAD" ]; then
            echo "::error::This PR branch is not based on the latest main. Rebase onto origin/main and push with --force-with-lease."
            exit 1
          fi
          echo "PR branch is based on the latest main ($MAIN_HEAD)."

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: examples/basic-nextjs/package-lock.json

      - name: Install basic-nextjs dependencies
        run: npm ci

      - name: Prepare offline type-check fixtures
        # Never replace component maps or copy live environment configuration.
        run: node tools/ci/prepare-typecheck.cjs

      - name: Validate canonical agent configuration
        run: npm run agents:check

      - name: Validate component registrations and content patterns
        run: npm run agents:validate

      - name: Run UI and agent-tooling unit tests
        run: npm test -- --runInBand --silent --no-cache

      - name: Check TypeScript
        run: npm run type-check

      - name: Report validation scope
        if: always()
        run: |
          {
            echo "## basic-nextjs PR validation"
            echo "Result: ${{ job.status }}"
            echo ""
            echo "Blocking checks: base branch, agent configuration, component validation, UI/tooling tests, and TypeScript."
            echo "TypeScript uses labelled offline fixtures, not a live Sitecore environment."
            echo "No live integration build, deployment, or GEO server tests were run."
            echo "ESLint/formatting are not part of this lightweight gate; the existing ESLint configuration issue is separate."
          } >> "$GITHUB_STEP_SUMMARY"
