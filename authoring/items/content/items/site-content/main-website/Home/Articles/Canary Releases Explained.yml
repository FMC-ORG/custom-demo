      Hint: NavigationTitle
      Value: Canary Releases Explained
    - ID: "63471bba-943c-4d82-b7bf-d7ec82babbf7"
      Hint: ArticleContent
      Value: "<p>A canary release routes a small slice of production traffic to a new version before rolling it out to everyone. The name comes from the canary in the coal mine: a small, early warning signal that something is wrong, long before the whole team feels it.</p><p>The mechanics are straightforward. You deploy the new version alongside the current one, send one to five percent of requests to it, and watch error rates, latency, and business metrics. If the canary stays healthy, you widen the slice in stages. If it degrades, you route traffic back and nobody outside the platform team ever notices.</p><p>The hard part is not the routing — modern load balancers and service meshes handle that — it is deciding what healthy means. A good canary policy defines success criteria upfront: error budget consumption, p99 latency ceilings, and at least one business signal such as checkout completion. Without explicit criteria, every canary judgement becomes a debate.</p><p>Teams that adopt canary releases consistently report a shift in culture: deploys stop being events. When any change can be sent to a sliver of users and reversed in seconds, shipping on a Friday afternoon stops being taboo and starts being routine.</p>"
