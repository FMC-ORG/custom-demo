    - ID: "63471bba-943c-4d82-b7bf-d7ec82babbf7"
      Hint: ArticleContent
      Value: "<p>Page views measure attendance, not experience. A visitor who opened five pages might be delighted or lost — the counter cannot tell the difference, and optimizing for it rewards the labyrinth.</p><p>Experience metrics start from intent. Task completion: did the visitor who came to compare plans reach the comparison? Time-to-value: how long from landing to the first genuinely useful moment? Frustration signals — rage clicks, back-and-forth loops, abandoned forms with one field left — locate the friction that averages hide.</p><p>The discipline is pairing every engagement metric with an outcome it should predict. Scroll depth is trivia until you show it correlates with renewal; search usage is noise until you connect it to conversion. Metrics that predict nothing get retired — the dashboard diet is the healthiest thing an analytics program can do.</p>"
