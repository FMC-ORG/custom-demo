    - ID: "63471bba-943c-4d82-b7bf-d7ec82babbf7"
      Hint: ArticleContent
      Value: "<p>Monitoring tells you that something you predicted might break has broken. Observability is the ability to ask new questions of a running system without shipping new code to answer them. The difference sounds academic until three services away, an unexplained latency spike is eating your error budget.</p><p>The classic three pillars — metrics, logs, and traces — are ingredients, not the meal. Metrics give you cheap, aggregated trend lines. Logs give you high-cardinality detail about single events. Traces stitch a request's journey across service boundaries so you can see where the time actually went. Observability emerges when the three are correlated: a spike on a chart links to the exemplar trace, which links to the structured logs of the slowest span.</p><p>The practices that move the needle are unglamorous. Propagate a request identifier everywhere. Emit structured, machine-parseable events instead of prose. Budget instrumentation like a feature, not an afterthought. And resist the urge to build a wall of dashboards nobody reads — a handful of service-level views tied to alerts beats fifty vanity charts.</p><p>Teams with real observability debug in minutes what others escalate for days, because the system can explain itself while the incident is still small.</p>"
