      Value: Zero Downtime Database Migrations
    - ID: "63471bba-943c-4d82-b7bf-d7ec82babbf7"
      Hint: ArticleContent
      Value: "<p>Every team eventually faces a schema change that cannot take the database down: renaming a column that a live service reads a thousand times per second, or splitting a table that has grown past its useful shape. Zero-downtime migrations make those changes boring.</p><p>The core discipline is expand and contract. First you expand: add the new column or table alongside the old one, and update the application to write to both. Then you backfill historical rows in small batches, throttled so replication lag stays flat. Only when reads have fully moved to the new shape do you contract: drop the old column in a later release, once nothing references it.</p><p>The most common failure mode is bundling a migration and a code change in one deploy. If the deploy rolls back but the migration does not, the old code meets a new schema and errors cascade. Keeping migrations forward-compatible for at least one release in each direction removes that trap entirely.</p><p>Tooling helps — online schema-change tools rewrite tables without long locks — but the habit that matters most is treating every migration as three small, reversible steps instead of one big irreversible one.</p>"
