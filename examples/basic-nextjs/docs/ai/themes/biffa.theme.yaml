# Client Brand Theme — Biffa
# Generated by sitecore-extract-theme from https://www.biffa.co.uk/

client:
  name: "Biffa"
  sourceUrl: "https://www.biffa.co.uk/"
  extractedAt: "2026-10-08T14:45:00Z"
  extractedBy: "pi-agent"

colors:
  primary: "#e42313"            # Biffa red — meta theme-color, hero/news/CTA band backgrounds, buttons
  primaryForeground: "#ffffff"
  secondary: "#051240"          # Deep navy — body text, headings, myBiffa pill, stat-card borders
  secondaryForeground: "#ffffff"
  accent: "#e42313"             # Red used for card titles, tags, inline links
  accentForeground: "#ffffff"
  background: "#ffffff"
  foreground: "#051240"
  muted: "#f7f7f7"              # Light grey section band ("Bold thinking")
  mutedForeground: "#3d4a6b"
  headerBackground: "transparent"   # Overlays the hero image; resolves to white/navy text on scroll
  headerForeground: "#051240"
  footerBackground: "#0d2437"   # Dark navy footer
  footerForeground: "#ffffff"
  border: "#051240"             # Thin navy outline on stat cards
  ring: "#e42313"
  extra:
    - name: "red-bright"
      value: "#fd2a17"
      usage: "Brighter red overlay on textured image bands (Let's work together / Our people make our culture)"
    - name: "dark"
      value: "#051240"
      usage: "Dark token for dark sections / AnnouncementBar"

typography:
  headingFamily: "Lexend Deca"
  headingWeight: "700"
  bodyFamily: "Lexend Deca"
  bodyWeight: "400"
  monoFamily: ""
  googleFontsUrl: "https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@400;500;600;700&display=swap"
  scale:
    hero: "64px"
    h1: "64px"
    h2: "46px"
    h3: "28px"
    body: "18px"
    small: "14px"
  headingTransform: "none"
  letterSpacing: "normal"
  lineHeight: "1.5"

spacing:
  density: "spacious"
  sectionGap: "96px"
  containerMaxWidth: "1440px"
  containerPadding: "40px"

shape:
  borderRadius: "1.5rem"
  buttonRadius: "9999px"        # Pill buttons with trailing arrow
  cardRadius: "1.5rem"          # ~24px rounded cards (news, audience, stats)
  imageRadius: "1.5rem 1.5rem 0 0"  # Images clip to card top corners
  shadowStyle: "subtle"         # Soft drop shadow on white cards
  borderStyle: "thin navy outline on stat cards; red outline pill tags"

tone:
  overall: "bold"
  colorMode: "mixed"            # White sections alternating with full-bleed red bands and dark navy footer
  contrast: "high"
  imagery: "photography"        # Real fleet/people photography + cut-out collage illustration
  heroStyle: "full-bleed-image"
  cardStyle: "image-top"
  navStyle: "transparent-overlay"

tailwind:
  colors:
    brand:
      primary: "#e42313"
      secondary: "#051240"
      accent: "#e42313"
  fontFamily:
    heading: ["Lexend Deca", "sans-serif"]
    body: ["Lexend Deca", "sans-serif"]
  borderRadius:
    DEFAULT: "1.5rem"
    button: "9999px"
    card: "1.5rem"

cssVariables: |
  :root {
    --brand-primary: #e42313;
    --brand-primary-foreground: #ffffff;
    --brand-secondary: #051240;
    --brand-secondary-foreground: #ffffff;
    --brand-accent: #e42313;
    --brand-accent-foreground: #ffffff;
    --brand-dark: #051240;
    --brand-dark-foreground: #ffffff;
    --brand-bg: #ffffff;
    --brand-fg: #051240;
    --brand-muted: #f7f7f7;
    --brand-muted-foreground: #3d4a6b;
    --brand-header-bg: #ffffff;
    --brand-header-fg: #051240;
    --brand-footer-bg: #0d2437;
    --brand-footer-fg: #ffffff;
    --brand-border: #051240;
    --brand-ring: #e42313;
    --brand-heading-font: 'Lexend Deca', sans-serif;
    --brand-body-font: 'Lexend Deca', sans-serif;
    --brand-radius: 1.5rem;
    --brand-button-radius: 9999px;
    --brand-card-radius: 1.5rem;
  }

extraction:
  confidence: "high"
  method: "playwright-full"
  notes:
    - "Primary red #E42313 confirmed by meta theme-color and pixel sampling of the News section background."
    - "Scraper picked a white outline button as primaryButton (radius 0px); visual inspection shows pill-shaped red buttons with trailing arrow — buttonRadius set to 9999px."
    - "No :root CSS custom properties exposed; colors from computed styles + pixel sampling (footer #0d2437, muted band #f7f7f7)."
    - "Lexend Deca is the live site font and is available on Google Fonts — no substitution needed."
    - "Header is transparent over the hero image; --brand-header-bg set to white for the non-overlay NavigationHeader variant. Use the Transparent variant to match the live site."
    - "Desktop screenshot hero is partially covered by the Usercentrics cookie consent modal; hero content: 'Business waste management made easy' with 'Get a quote' pill CTA."
    - "Two textured red image bands (Let's work together, Our people make our culture) use background photography with red overlay (#fd2a17) — template components will approximate with solid primary."
    - "CSS variable names follow docs/ai/reference/brand-variables.md (--brand-muted-foreground, --brand-dark*) rather than the eurobank example's --brand-muted-fg."
